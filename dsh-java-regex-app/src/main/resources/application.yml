server:
  port: 8099

spring:
  application:
    name: dsh-java-regex
  web:
    resources:
      cache:
        cachecontrol:
          no-cache: true
  jackson:
    default-property-inclusion: non_null

dsh:
  regexlab:
    data-directory: ${user.home}/.dsh-java-regex
    harness:
      base-url: ${DSH_HARNESS_BASE_URL:http://127.0.0.1:8090}
